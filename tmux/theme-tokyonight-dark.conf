# Tokyo Night theme colors
set -g mode-style 'bg=#7aa2f7 fg=#1a1b26'
set -g status-style 'bg=#16161e fg=#a9b1d6'
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g message-style 'bg=#7aa2f7 fg=#1a1b26'

# Status bar
set -g status-left-style 'bg=#7aa2f7 fg=#1a1b26 bold'
set -g status-right-style 'bg=#16161e fg=#737aa2'

# Window status — embed colors in the format string so it wins against any
# window-status-*-format set in tmux.conf.
set -g window-status-current-format '#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W '
set -g window-status-format '#[fg=#737aa2,bg=#16161e] #I:#W '
