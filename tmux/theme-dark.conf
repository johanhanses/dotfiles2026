# Catppuccin Macchiato theme colors
set -g mode-style 'bg=#c6a0f6 fg=#24273a'
set -g status-style 'bg=#1e2030 fg=#a5adcb'
set -g pane-border-style 'fg=#5b6078'
set -g pane-active-border-style 'fg=#c6a0f6'
set -g message-style 'bg=#c6a0f6 fg=#24273a'

# Status bar
set -g status-left-style 'bg=#c6a0f6 fg=#24273a bold'
set -g status-right-style 'bg=#1e2030 fg=#6e738d'
set -g window-status-current-style 'bg=#c6a0f6 fg=#24273a bold'
set -g window-status-style 'bg=#1e2030 fg=#6e738d'
