# Conductor Stone dark theme colors
set -g mode-style 'bg=#d4a054 fg=#141110'
set -g status-style 'bg=#1c1917 fg=#a5a09c'
set -g pane-border-style 'fg=#3d3633'
set -g pane-active-border-style 'fg=#d4a054'
set -g message-style 'bg=#d4a054 fg=#141110'

# Status bar
set -g status-left-style 'bg=#d4a054 fg=#141110 bold'
set -g status-right-style 'bg=#1c1917 fg=#6b6460'
set -g window-status-current-style 'bg=#d4a054 fg=#141110 bold'
set -g window-status-style 'bg=#1c1917 fg=#6b6460'
