# Tokyo Night theme colors
set -g mode-style 'bg=#7aa2f7 fg=#1a1b26'
set -g status-style 'bg=#16161e fg=#a9b1d6'
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g message-style 'bg=#7aa2f7 fg=#1a1b26'

# Status bar
set -g status-left-style 'bg=#7aa2f7 fg=#1a1b26 bold'
set -g status-right-style 'bg=#16161e fg=#737aa2'
set -g window-status-current-style 'bg=#7aa2f7 fg=#1a1b26 bold'
set -g window-status-style 'bg=#16161e fg=#737aa2'
