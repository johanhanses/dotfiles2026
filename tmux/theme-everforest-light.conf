# Everforest Light (Medium) theme colors
set -g mode-style 'bg=#3A94C5 fg=#FDF6E3'
set -g status-style 'bg=#EFEBD4 fg=#5C6A72'
set -g pane-border-style 'fg=#BDC3AF'
set -g pane-active-border-style 'fg=#3A94C5'
set -g message-style 'bg=#3A94C5 fg=#FDF6E3'

# Status bar
set -g status-left-style 'bg=#3A94C5 fg=#FDF6E3 bold'
set -g status-right-style 'bg=#EFEBD4 fg=#829181'

# Window status — embed colors in the format string so it wins against any
# window-status-*-format set in tmux.conf.
set -g window-status-current-format '#[fg=#FDF6E3,bg=#3A94C5,bold] #I:#W '
set -g window-status-format '#[fg=#829181,bg=#EFEBD4] #I:#W '
