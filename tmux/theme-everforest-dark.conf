# Everforest Dark (Hard) theme colors
set -g mode-style 'bg=#7FBBB3 fg=#1E2326'
set -g status-style 'bg=#2E383C fg=#D3C6AA'
set -g pane-border-style 'fg=#414B50'
set -g pane-active-border-style 'fg=#7FBBB3'
set -g message-style 'bg=#7FBBB3 fg=#1E2326'

# Status bar
set -g status-left-style 'bg=#7FBBB3 fg=#1E2326 bold'
set -g status-right-style 'bg=#2E383C fg=#859289'

# Window status — embed colors in the format string so it wins against any
# window-status-*-format set in tmux.conf.
set -g window-status-current-format '#[fg=#1E2326,bg=#7FBBB3,bold] #I:#W '
set -g window-status-format '#[fg=#859289,bg=#2E383C] #I:#W '
