# Catppuccin Latte theme colors
set -g mode-style 'bg=#8839ef fg=#eff1f5'
set -g status-style 'bg=#e6e9ef fg=#6c6f85'
set -g pane-border-style 'fg=#acb0be'
set -g pane-active-border-style 'fg=#8839ef'
set -g message-style 'bg=#8839ef fg=#eff1f5'

# Status bar
set -g status-left-style 'bg=#8839ef fg=#eff1f5 bold'
set -g status-right-style 'bg=#e6e9ef fg=#9ca0b0'
set -g window-status-current-style 'bg=#8839ef fg=#eff1f5 bold'
set -g window-status-style 'bg=#e6e9ef fg=#9ca0b0'
