# Conductor Stone light theme colors
set -g mode-style 'bg=#9a7030 fg=#ffffff'
set -g status-style 'bg=#f5f3f1 fg=#6b6460'
set -g pane-border-style 'fg=#ddd9d6'
set -g pane-active-border-style 'fg=#9a7030'
set -g message-style 'bg=#9a7030 fg=#ffffff'

# Status bar
set -g status-left-style 'bg=#9a7030 fg=#ffffff bold'
set -g status-right-style 'bg=#f5f3f1 fg=#8e8885'
set -g window-status-current-style 'bg=#9a7030 fg=#ffffff bold'
set -g window-status-style 'bg=#f5f3f1 fg=#8e8885'
