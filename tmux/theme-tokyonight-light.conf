# Tokyo Night Day theme colors
set -g mode-style 'bg=#2e7de9 fg=#e1e2e7'
set -g copy-mode-selection-style 'bg=#2e7de9 fg=#e1e2e7'
set -g copy-mode-match-style 'bg=#8c6c3e fg=#e1e2e7'
set -g copy-mode-current-match-style 'bg=#b15c00 fg=#e1e2e7'
set -g status-style 'bg=#d0d5e3 fg=#4c505e'
set -g pane-border-style 'fg=#a8aecb'
set -g pane-active-border-style 'fg=#2e7de9'
set -g message-style 'bg=#2e7de9 fg=#e1e2e7'

# Status bar
set -g status-left-style 'bg=#2e7de9 fg=#e1e2e7 bold'
set -g status-right-style 'bg=#d0d5e3 fg=#68709a'

# Window status — embed colors in the format string so it wins against any
# window-status-*-format set in tmux.conf.
set -g window-status-current-format '#[fg=#e1e2e7,bg=#2e7de9,bold] #I:#W '
set -g window-status-format '#[fg=#68709a,bg=#d0d5e3] #I:#W '
