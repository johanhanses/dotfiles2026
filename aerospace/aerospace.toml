after-login-command = []
after-startup-command = [
  'exec-and-forget sketchybar',
]

exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focus-changed = ['move-mouse window-lazy-center']

automatically-unhide-macos-hidden-apps = false

[gaps]
# Per-monitor gaps: built-in MacBook keeps tight 8px everywhere (small
# screen, every pixel counts). External monitors get roomier 24px gaps
# so tiled windows breathe on the larger canvas.
# Run `aerospace list-monitors` to see your display names if the regex
# below doesn't match your built-in panel.
inner.horizontal = [{ monitor.'^Built-in' = 8 }, 24]
inner.vertical = [{ monitor.'^Built-in' = 8 }, 24]
outer.left = [{ monitor.'^Built-in' = 8 }, 24]
outer.bottom = [{ monitor.'^Built-in' = 8 }, 24]
outer.right = [{ monitor.'^Built-in' = 8 }, 24]
# Top gap per-monitor: 4 on built-in (safe area starts below the notch),
# 56 on external (32px SketchyBar + 24px breathing to match the other
# external gaps).
outer.top = [{ monitor.'^Built-in' = 4 }, 56]

[mode.main.binding]
alt-o = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-ctrl-h = 'resize smart -50'
alt-ctrl-l = 'resize smart +50'
alt-ctrl-k = 'resize smart +50'
alt-ctrl-j = 'resize smart -50'

# Workspace switch + move: Ctrl-based to stay 2-finger and keep Nordic
# Alt+N combos (@ [ ] | © § £ $ etc.) free for typing. Ctrl is not a
# character-producing modifier on macOS, and Ctrl+<number> isn't bound
# by default in vim/neovim, tmux, zsh, or Ghostty.
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-4 = 'workspace 4'
ctrl-5 = 'workspace 5'
ctrl-6 = 'workspace 6'
ctrl-7 = 'workspace 7'
ctrl-8 = 'workspace 8'
ctrl-9 = 'workspace 9'

ctrl-shift-1 = 'move-node-to-workspace 1'
ctrl-shift-2 = 'move-node-to-workspace 2'
ctrl-shift-3 = 'move-node-to-workspace 3'
ctrl-shift-4 = 'move-node-to-workspace 4'
ctrl-shift-5 = 'move-node-to-workspace 5'
ctrl-shift-6 = 'move-node-to-workspace 6'
ctrl-shift-7 = 'move-node-to-workspace 7'
ctrl-shift-8 = 'move-node-to-workspace 8'
ctrl-shift-9 = 'move-node-to-workspace 9'

# Workspace back/forth + move to next monitor — both are workspace
# operations, so they live under Ctrl alongside ctrl-1..9. Ctrl+0 is the
# natural "last" slot since workspaces are 1..9. Avoids stealing
# Ctrl+Tab from browsers (Aerospace captures globally).
ctrl-0 = 'workspace-back-and-forth'
ctrl-shift-0 = 'move-workspace-to-monitor --wrap-around next'

alt-f = 'fullscreen'
alt-shift-space = 'layout floating tiling'

# Theme family toggle (Tokyo Night <-> Everforest). 4-finger chord to
# avoid accidental triggers; macOS Dark/Light keeps driving within-family.
cmd-alt-ctrl-t = 'exec-and-forget /bin/sh -c "$HOME/Repos/github.com/johanhanses/dotfiles2026/scripts/theme-switch"'

alt-shift-enter = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'
