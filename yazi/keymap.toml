[manager]
prepend_keymap = [
  { on = [ "g", "h" ], run = "cd ~",                          desc = "Jump to home" },
  { on = [ "g", "c" ], run = "cd ~/.config",                  desc = "Jump to ~/.config" },
  { on = [ "g", "d" ], run = "cd ~/conductor/workspaces",     desc = "Jump to conductor workspaces" },
  { on = [ "g", "r" ], run = "cd ~/Repos/github.com/johanhanses/dotfiles2026", desc = "Jump to dotfiles" },
  { on = [ "g", "D" ], run = "cd ~/Downloads",                desc = "Jump to Downloads" },
  { on = [ "g", "p" ], run = "cd ~/Pictures",                 desc = "Jump to Pictures" },
  { on = [ "Q" ],      run = "close",                         desc = "Quit and cd to current dir" },
]
