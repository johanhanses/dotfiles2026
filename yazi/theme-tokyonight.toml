# Tokyo Night theme for yazi

[manager]
cwd = { fg = "#7aa2f7" }

hovered         = { reversed = true }
preview_hovered = { underline = true }

find_keyword  = { fg = "#e0af68", italic = true }
find_position = { fg = "#ff9e64", bg = "reset", italic = true }

marker_copied   = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut      = { fg = "#f7768e", bg = "#f7768e" }
marker_marked   = { fg = "#7aa2f7", bg = "#7aa2f7" }
marker_selected = { fg = "#e0af68", bg = "#e0af68" }

tab_active   = { fg = "#1a1b26", bg = "#7aa2f7" }
tab_inactive = { fg = "#c0caf5", bg = "#292e42" }
tab_width    = 1

count_copied   = { fg = "#1a1b26", bg = "#9ece6a" }
count_cut      = { fg = "#1a1b26", bg = "#f7768e" }
count_selected = { fg = "#1a1b26", bg = "#e0af68" }

border_symbol = "│"
border_style  = { fg = "#7aa2f7" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#292e42", bg = "#292e42" }

mode_normal = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
mode_select = { fg = "#1a1b26", bg = "#9ece6a", bold = true }
mode_unset  = { fg = "#1a1b26", bg = "#bb9af7", bold = true }

progress_label  = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#292e42" }
progress_error  = { fg = "#f7768e", bg = "#292e42" }

permissions_t = { fg = "#7aa2f7" }
permissions_r = { fg = "#e0af68" }
permissions_w = { fg = "#f7768e" }
permissions_x = { fg = "#9ece6a" }
permissions_s = { fg = "#565f89" }

[select]
border   = { fg = "#7aa2f7" }
active   = { fg = "#bb9af7" }
inactive = {}

[input]
border   = { fg = "#7aa2f7" }
title    = {}
value    = {}
selected = { reversed = true }

[completion]
border   = { fg = "#7aa2f7" }
active   = { bg = "#292e42" }
inactive = {}

[tasks]
border  = { fg = "#7aa2f7" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#16161e" }
cand            = { fg = "#7dcfff" }
rest            = { fg = "#a9b1d6" }
desc            = { fg = "#ff9e64" }
separator       = "  "
separator_style = { fg = "#565f89" }

[help]
on      = { fg = "#ff9e64" }
run     = { fg = "#7dcfff" }
desc    = {}
hovered = { bg = "#292e42", bold = true }
footer  = { fg = "#1a1b26", bg = "#c0caf5" }

[filetype]
rules = [
  { mime = "image/*", fg = "#e0af68" },
  { mime = "video/*", fg = "#bb9af7" },
  { mime = "audio/*", fg = "#bb9af7" },
  { mime = "application/zip",             fg = "#f7768e" },
  { mime = "application/gzip",            fg = "#f7768e" },
  { mime = "application/x-tar",           fg = "#f7768e" },
  { mime = "application/x-bzip",          fg = "#f7768e" },
  { mime = "application/x-bzip2",         fg = "#f7768e" },
  { mime = "application/x-7z-compressed", fg = "#f7768e" },
  { mime = "application/x-rar",           fg = "#f7768e" },
  { name = "*",  fg = "#c0caf5" },
  { name = "*/", fg = "#7aa2f7" },
]
